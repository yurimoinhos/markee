<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AggiPay Console</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #dbeafe 0%, #f8fafc 45%, #e2e8f0 100%);
        color: #0f172a;
      }
      main {
        max-width: 640px;
        padding: 28px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      }
      a {
        color: #0f766e;
        text-decoration: none;
        font-weight: 600;
      }
      code {
        background: #f1f5f9;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Frontend Next.js indisponível</h1>
      <p>
        O backend está ativo, mas o runtime do Next não respondeu em
        <code>NEXT_INTERNAL_URL</code>.
      </p>
      <p>
        API segue disponível em <a href="/api/v1/finance/dashboard">/api/v1/*</a> e documentação em
        <a href="/swagger">/swagger</a>.
      </p>
    </main>
  </body>
</html>
