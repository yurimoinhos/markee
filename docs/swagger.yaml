  /contracts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.BaseErr'
      security:
      - BearerAuth: []
      summary: Listar contratos
      tags:
      - Contracts
    post:
      consumes:
      - application/json
      description: Cadastra contrato de serviço de software
      parameters:
      - description: Dados do contrato
        in: body
        name: body
        required: true
