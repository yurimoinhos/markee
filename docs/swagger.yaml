  /charges:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.BaseErr'
      security:
      - BearerAuth: []
      summary: Listar cobranças
      tags:
      - Billing
    post:
      consumes:
      - application/json
      description: Gera cobrança única, mensal ou por milestone
      parameters:
      - description: Dados da cobrança
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/billing.CreateChargeInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.BaseErr'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.BaseErr'
      security:
      - BearerAuth: []
      summary: Criar cobrança
      tags:
      - Billing
  /charges/{id}/pay-link:
    post:
      parameters:
      - description: ID da cobrança
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.PaymentLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.BaseErr'
      security:
      - BearerAuth: []
      summary: Obter link de pagamento
      tags:
      - Billing
  /charges/{id}/pay-qr:
    post:
      parameters:
      - description: ID da cobrança
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billing.PaymentQRResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.BaseErr'
      security:
      - BearerAuth: []
      summary: Obter QR Code de pagamento
      tags:
